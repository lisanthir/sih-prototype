<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYUSH SETU — Workforce Intelligence Prototype</title>
<style>
:root{--ink:#17352c;--muted:#64766f;--bg:#f4f7f2;--card:#fff;--line:#dce6df;--accent:#2f6f57;--accent2:#dfeee5;--gold:#b08b42;--danger:#b84c4c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.brand{font-weight:850;letter-spacing:.5px;font-size:20px}.brand small{display:block;font-size:9px;color:var(--gold);letter-spacing:1.6px}
.user{display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent2);display:grid;place-items:center;font-weight:800}
.layout{display:flex;min-height:calc(100vh - 68px)}.side{width:245px;background:#17352c;color:#dce9e2;padding:22px 14px;flex-shrink:0}.side h4{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#9eb7ab;margin:8px 12px 12px}.nav{display:block;width:100%;padding:11px 12px;margin:4px 0;border-radius:9px;background:transparent;color:inherit;text-align:left}.nav.active,.nav:hover{background:#2b5d4c;color:#fff}.rolebox{margin-top:22px;padding:14px;border:1px solid #456b5c;border-radius:12px;background:#21463a}.rolebox label{font-size:10px;text-transform:uppercase;color:#a9c2b7}.rolebox select{width:100%;margin-top:7px;padding:8px;border-radius:8px;border:0}
main{flex:1;padding:28px;max-width:1450px;margin:auto;width:100%}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:800}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.hero h1{font-size:32px;margin:5px 0}.hero p{color:var(--muted);margin:0;max-width:720px}.btn{padding:10px 15px;border-radius:9px;background:var(--accent);color:white;font-weight:700}.btn.secondary{background:#edf3ef;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #19382c0a}.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:28px;font-weight:850;margin:7px 0}.trend{font-size:12px;color:var(--accent);font-weight:700}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 12px}.cols{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.skill{margin:12px 0}.skilltop{display:flex;justify-content:space-between;font-size:13px}.bar{height:8px;background:#e9efeb;border-radius:10px;overflow:hidden;margin-top:6px}.fill{height:100%;background:var(--accent);border-radius:10px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:var(--accent2);color:var(--accent);font-size:11px;font-weight:800}.badge.gold{background:#f4ecd9;color:#8a6825}.badge.red{background:#fae5e5;color:var(--danger)}.list{display:grid;gap:10px}.item{padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.item strong{display:block;margin-bottom:4px}.item p{margin:0;color:var(--muted);font-size:12px}.match{float:right;font-size:18px;font-weight:850;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}.chart{height:170px;display:flex;align-items:end;gap:14px;padding:15px 5px 0}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}.vbar{width:70%;max-width:55px;background:var(--accent);border-radius:7px 7px 0 0}.barcol span{font-size:10px;color:var(--muted)}.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1;border:1px solid var(--line);padding:10px;border-radius:9px}
.flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.step{padding:9px 12px;border-radius:9px;background:#edf3ef;font-size:12px;font-weight:700}.arrow{color:#8da095}.notice{background:#fff9e9;border:1px solid #eadcb6;color:#765c25;padding:10px 13px;border-radius:9px;font-size:12px}
footer{padding:18px 0;color:#809088;font-size:11px;text-align:center}
@media(max-width:900px){.side{width:72px}.side h4,.side .nav span,.rolebox label{display:none}.rolebox{padding:6px}.rolebox select{font-size:0}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}}
@media(max-width:560px){.top{padding:0 14px}.side{display:none}main{padding:18px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}.card{padding:14px}table{font-size:11px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AYUSH SETU <small>WORKFORCE INTELLIGENCE</small></div>
  <div class="user"><span class="badge">● Prototype / Sample Data</span><div class="avatar">AS</div></div>
</header>
<div class="layout">
<aside class="side">
  <h4>Platform</h4>
  <button class="nav active" onclick="show('overview',this)">◈ <span>Overview</span></button>
  <button class="nav" onclick="show('skills',this)">✦ <span>Skill Mapping</span></button>
  <button class="nav" onclick="show('opportunities',this)">⌕ <span>Opportunities</span></button>
  <button class="nav" onclick="show('applications',this)">✓ <span>Applications</span></button>
  <button class="nav" onclick="show('verification',this)">◇ <span>Verification</span></button>
  <button class="nav" onclick="show('analytics',this)">▥ <span>Analytics</span></button>
  <button class="nav" onclick="show('assistant',this)">✧ <span>Career Assistant</span></button>
  <div class="rolebox"><label>Demo role</label><select id="role" onchange="roleChange()"><option>Student</option><option>College / SPOC</option><option>Industry / Recruiter</option><option>Ministry / Admin</option></select></div>
</aside>
<main id="app"></main>
</div>
<script>
const data={
student:{name:"Ananya Sharma",stream:"BAMS",year:"3rd Year",score:82},
opps:[
["Clinical Research Intern","AYUSH Research Centre","94%","Chennai","3 months","₹8,000/mo"],
["Panchakarma Clinical Intern","Wellness & Therapy Network","91%","Coimbatore","2 months","₹7,500/mo"],
["Ayurvedic Pharmacology Research","Herbal R&D Lab","87%","Bengaluru","4 months","₹10,000/mo"],
["Yoga Therapy Intern","Integrative Wellness Network","79%","Kochi","3 months","₹6,000/mo"]]};
let current="overview";
function roleChange(){const r=document.getElementById('role').value;document.querySelector('.brand').title=r;show('overview',document.querySelector('.nav'))}
function show(page,el){
 current=page; document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active')); if(el)el.classList.add('active');
 const role=document.getElementById('role').value; let html="";
 if(page==="overview") html=dashboard(role);
 if(page==="skills") html=skills();
 if(page==="opportunities") html=opportunities();
 if(page==="applications") html=applications();
 if(page==="verification") html=verification(role);
 if(page==="analytics") html=analytics(role);
 if(page==="assistant") html=assistant();
 document.getElementById('app').innerHTML=html;
}
function dashboard(role){
 if(role==="Student") return `<div class="hero"><div><div class="eyebrow">Student workspace</div><h1>Good morning, Ananya</h1><p>Your AYUSH career journey, from competency mapping to verified opportunities.</p></div><button class="btn" onclick="show('skills')">View Skill Map</button></div>
<div class="grid"><div class="card stat"><div class="label">AYUSH Skill Score</div><div class="num">82%</div><div class="trend">↑ 6% this month</div></div><div class="card stat"><div class="label">Recommended Opportunities</div><div class="num">14</div><div class="trend">4 high matches</div></div><div class="card stat"><div class="label">Applications</div><div class="num">5</div><div class="trend">2 shortlisted</div></div><div class="card stat"><div class="label">Career Readiness</div><div class="num">76%</div><div class="trend">On track</div></div></div>
<div class="section cols"><div class="card"><h2>Your top competencies</h2>${skill("Panchakarma",88)}${skill("Ayurvedic Pharmacology",81)}${skill("Communication",84)}${skill("Clinical Assessment",72)}${skill("Research Methodology",61)}</div><div class="card"><h2>Recommended career</h2><div class="badge gold">89% MATCH</div><h2 style="margin-top:12px">Ayurvedic Clinical Research</h2><p style="color:var(--muted);font-size:13px">Build Clinical Research Methodology and Biostatistics to improve your readiness.</p><button class="btn secondary" onclick="show('skills')">See skill gaps</button></div></div>`;
 if(role==="College / SPOC") return roleDash("College & Placement Intelligence",["1,248","1,176","86","318"],["Registered Students","Verified Students","Active Internships","Placements"],"68%");
 if(role==="Industry / Recruiter") return roleDash("Industry Talent Dashboard",["18","426","96","24"],["Active Opportunities","Applications","Matched Candidates","Shortlisted"],"92%");
 return roleDash("AYUSH Workforce Intelligence",["12,486","428","684","1,276"],["Registered Students","Verified Institutions","Active Opportunities","Placements"],"66.9%");
}
function roleDash(title,nums,labels,rate){return `<div class="hero"><div><div class="eyebrow">Role dashboard</div><h1>${title}</h1><p>Connected ecosystem view across skills, opportunities, verification and outcomes.</p></div><span class="badge">Sample Data</span></div><div class="grid">${nums.map((n,i)=>`<div class="card stat"><div class="label">${labels[i]}</div><div class="num">${n}</div><div class="trend">Live prototype metric</div></div>`).join("")}</div><div class="section cols"><div class="card"><h2>Placement conversion</h2><div class="chart">${[48,57,64,61,72,67,74].map((v,i)=>`<div class="barcol"><div class="vbar" style="height:${v*1.7}px"></div><span>Q${i+1}</span></div>`).join("")}</div></div><div class="card"><h2>Priority insight</h2><div class="notice">Clinical Research and Panchakarma show strong opportunity demand. Use skill-gap intelligence to direct learning and matching.</div><div class="section"><div class="flow"><span class="step">Skills</span><span class="arrow">→</span><span class="step">Match</span><span class="arrow">→</span><span class="step">Apply</span><span class="arrow">→</span><span class="step">Place</span></div></div></div></div>`}
function skill(n,v){return `<div class="skill"><div class="skilltop"><span>${n}</span><b>${v}%</b></div><div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`}
function skills(){return `<div class="hero"><div><div class="eyebrow">AI-assisted competency mapping</div><h1>Your AYUSH Skill Map</h1><p>Structured competencies across clinical, knowledge, research and professional domains.</p></div><div><span class="badge">Verified Student ✓</span></div></div><div class="grid"><div class="card stat"><div class="label">Overall Skill Score</div><div class="num">82%</div></div><div class="card stat"><div class="label">Career Readiness</div><div class="num">76%</div></div><div class="card stat"><div class="label">Target Career Match</div><div class="num">89%</div></div><div class="card stat"><div class="label">Skill Gaps</div><div class="num">3</div></div></div><div class="section cols"><div class="card"><h2>Clinical Skills</h2>${skill("Panchakarma",88)}${skill("Patient Assessment",74)}${skill("Clinical Procedures",69)}</div><div class="card"><h2>Knowledge</h2>${skill("Ayurvedic Pharmacology",81)}${skill("Dravyaguna",77)}${skill("Kayachikitsa",73)}</div><div class="card"><h2>Research</h2>${skill("Research Methodology",61)}${skill("Data Interpretation",58)}${skill("Documentation",83)}</div><div class="card"><h2>Professional</h2>${skill("Communication",84)}${skill("Teamwork",89)}${skill("Digital Skills",71)}</div></div><div class="section card"><h2>AI Skill-Gap Analysis</h2><p style="color:var(--muted)">Target career: <b>Ayurvedic Clinical Researcher</b> · Current match <b>72%</b></p><div class="grid"><div class="item"><span class="badge">Have</span><p>✓ Ayurvedic Pharmacology<br>✓ Research Basics<br>✓ Documentation</p></div><div class="item"><span class="badge red">Improve</span><p>⚠ Clinical Research Methodology<br>⚠ Biostatistics<br>⚠ Research Data Analysis</p></div><div class="item"><span class="badge gold">Pathway</span><p>1. Learn methodology<br>2. Build biostatistics basics<br>3. Apply for research internship</p></div><div class="item"><span class="badge">Projected</span><p><b style="font-size:22px">72% → 91%</b><br>after priority skill development</p></div></div></div>`}
function opportunities(){return `<div class="hero"><div><div class="eyebrow">Verified opportunity marketplace</div><h1>Opportunities matched to you</h1><p>Explainable matching considers stream, skills, specialization, location, duration, stipend and preferences.</p></div><button class="btn" onclick="alert('Application submitted in demo mode!')">Quick Apply</button></div><div class="search"><input placeholder="Search skills, roles or careers..." oninput="filterOpp(this.value)"><button class="btn secondary">Filters</button></div><div id="oppList" class="list">${data.opps.map(o=>opp(o)).join("")}</div>`}
function opp(o){return `<div class="item"><span class="match">${o[2]}</span><strong>${o[0]}</strong><span class="badge">🟢 Verified Opportunity</span> <span class="badge gold">${o[1]}</span><p style="margin-top:9px">${o[3]} · ${o[4]} · ${o[5]}</p><p style="margin-top:6px">Why you match: ✓ BAMS · ✓ Relevant skills · ✓ Preferred location · ✓ Language fit</p><button class="btn secondary" style="margin-top:10px" onclick="alert('Demo: opportunity details opened')">View Match Details</button> <button class="btn" style="margin-top:10px" onclick="alert('Application submitted!')">Apply</button></div>`}
function filterOpp(q){const list=data.opps.filter(o=>o.join(" ").toLowerCase().includes(q.toLowerCase()));document.getElementById('oppList').innerHTML=list.map(o=>opp(o)).join("")||'<div class="card">No matching opportunities.</div>'}
function applications(){return `<div class="hero"><div><div class="eyebrow">Career pipeline</div><h1>Application Tracking</h1><p>Track every opportunity from application through selection.</p></div></div><div class="card"><table><thead><tr><th>Opportunity</th><th>Organization</th><th>Match</th><th>Status</th></tr></thead><tbody>${data.opps.map((o,i)=>`<tr><td><b>${o[0]}</b></td><td>${o[1]}</td><td>${o[2]}</td><td><span class="badge">${["Shortlisted","Under Review","Applied","Interview Scheduled"][i%4]}</span></td></tr>`).join("")}</tbody></table></div><div class="section card"><h2>Application journey</h2><div class="flow"><span class="step">✓ Applied</span><span class="arrow">→</span><span class="step">✓ Under Review</span><span class="arrow">→</span><span class="step">✓ Shortlisted</span><span class="arrow">→</span><span class="step">Interview</span><span class="arrow">→</span><span class="step">Selected</span></div></div>`}
function verification(role){return `<div class="hero"><div><div class="eyebrow">Trust layer</div><h1>Verification Center</h1><p>Verification is designed as a first-class layer for students, colleges, industry and opportunities.</p></div></div><div class="grid"><div class="card"><h2>Student</h2><p>Identity submitted</p><p>Academic details ✓</p><p>College verified ✓</p><span class="badge">🟢 Verified Student</span></div><div class="card"><h2>College / SPOC</h2><p>Institution details ✓</p><p>SPOC review ✓</p><span class="badge">🟢 Verified College</span></div><div class="card"><h2>Industry</h2><p>Organization details ✓</p><p>Official email ✓</p><p>Admin review ✓</p><span class="badge">🟢 Verified Industry</span></div><div class="card"><h2>Opportunity</h2><p>Submitted → Admin review → Approved</p><span class="badge">🟢 Verified Opportunity</span></div></div><div class="section card"><h2>Admin Review Queue</h2><table><tr><th>Item</th><th>Type</th><th>Status</th><th>Action</th></tr><tr><td>Clinical Research Intern</td><td>Opportunity</td><td><span class="badge gold">Review</span></td><td><button class="btn secondary">Review</button></td></tr><tr><td>Wellness & Therapy Network</td><td>Industry</td><td><span class="badge">Verified</span></td><td><button class="btn secondary">View</button></td></tr><tr><td>3 reported listings</td><td>Reports</td><td><span class="badge red">Attention</span></td><td><button class="btn secondary">Investigate</button></td></tr></table></div>`}
function analytics(role){return `<div class="hero"><div><div class="eyebrow">National workforce intelligence</div><h1>AYUSH Workforce Analytics</h1><p>Aggregated skill, opportunity and placement intelligence for decision support.</p></div><span class="badge gold">Prototype / Sample Data</span></div><div class="grid"><div class="card stat"><div class="label">Registered Students</div><div class="num">12,486</div></div><div class="card stat"><div class="label">Active Opportunities</div><div class="num">684</div></div><div class="card stat"><div class="label">Applications</div><div class="num">3,842</div></div><div class="card stat"><div class="label">Placements</div><div class="num">1,276</div></div></div><div class="section cols"><div class="card"><h2>State-wise placement</h2>${state("Tamil Nadu",74)}${state("Kerala",71)}${state("Karnataka",67)}${state("Maharashtra",63)}${state("Uttar Pradesh",59)}</div><div class="card"><h2>Top demanded skills</h2>${["Panchakarma","Clinical Research","Ayurvedic Pharmacology","Yoga Therapy","Herbal Quality Assurance"].map((x,i)=>`<div class="item" style="margin:7px 0"><b>${i+1}. ${x}</b><span class="match">${[32,28,24,18,14][i]}%</span></div>`).join("")}</div></div><div class="section grid"><div class="card"><h2>High-priority skill gap</h2><span class="badge red">Critical</span><h3>Biostatistics</h3><p style="color:var(--muted)">High demand · Low availability</p></div><div class="card"><h2>Industry demand</h2><h3>Clinical Research — 32%</h3><p style="color:var(--muted)">Ayurvedic Pharma 24% · Wellness 18%</p></div><div class="card"><h2>Placement funnel</h2><div class="flow"><span class="step">3,842 Applied</span><span class="arrow">→</span><span class="step">1,920 Interviews</span><span class="arrow">→</span><span class="step">1,276 Placed</span></div></div><div class="card"><h2>Policy insight</h2><p style="color:var(--muted)">Use emerging skill gaps to guide curriculum, training and industry partnerships.</p></div></div>`}
function state(n,v){return `<div class="skill"><div class="skilltop"><span>${n}</span><b>${v}%</b></div><div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`}
function assistant(){return `<div class="hero"><div><div class="eyebrow">AI career guidance</div><h1>AYUSH Career Assistant</h1><p>Personalized, explainable career guidance based on the student's skill profile.</p></div></div><div class="cols"><div class="card"><h2>Conversation</h2><div class="item"><b>Student</b><p>I am a BAMS student interested in research. What careers suit me?</p></div><div class="item" style="margin-top:10px"><b>AYUSH Assistant</b><p>Based on your current profile, your strongest paths are:</p><ol><li>Ayurvedic Clinical Research — <b>89%</b></li><li>Ayurvedic Pharmacology — <b>84%</b></li><li>Medical Documentation — <b>78%</b></li><li>Herbal Product R&D — <b>74%</b></li></ol><p>Your priority skill gaps are Clinical Research Methodology, Biostatistics and Data Analysis.</p></div><div class="search" style="margin-top:12px"><input placeholder="Ask about your AYUSH career..."><button class="btn">Ask</button></div></div><div class="card"><h2>Suggested questions</h2><div class="list">${["What career suits my skills?","What skills should I learn?","Find internships for me","Why am I not matching this opportunity?"].map(x=>`<button class="nav" style="background:#edf3ef;color:var(--ink)" onclick="alert('Demo assistant: '+${JSON.stringify(x)})">${x}</button>`).join("")}</div></div></div>`}
show('overview');
</script>
</body>
</html>
